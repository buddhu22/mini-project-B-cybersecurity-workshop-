{% extends 'base.html' %}{% block title %}Create Participant Account{% endblock %}{% block content %}<section class="form-shell"><a class="back-link" href="{{ url_for('auth.user_portal') }}">← Participant Portal</a><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Your password is stored as a secure hash.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full Name<input name="full_name" autocomplete="name" required maxlength="120" value="{{ values.full_name }}">{% if errors.full_name %}<small class="field-error">{{ errors.full_name }}</small>{% endif %}</label><label>Email<input type="email" name="email" autocomplete="email" required maxlength="254" value="{{ values.email }}">{% if errors.email %}<small class="field-error">{{ errors.email }}</small>{% endif %}</label><label>Password<input type="password" name="password" autocomplete="new-password" required>{% if errors.password %}<small class="field-error">{{ errors.password }}</small>{% else %}<small>12+ characters with uppercase, lowercase, number, and symbol.</small>{% endif %}</label><label>Confirm Password<input type="password" name="confirm_password" autocomplete="new-password" required>{% if errors.confirm_password %}<small class="field-error">{{ errors.confirm_password }}</small>{% endif %}</label><button class="button" type="submit">Create Account</button></form><p class="form-bottom">Already registered? <a href="{{ url_for('auth.user_login') }}">Sign in</a></p></section>{% endblock %}
