{% extends 'base.html' %}{% block title %}{{ heading }} · Administration{% endblock %}{% block content %}<a class="back-link" href="{{ url_for('admin.resource_list') }}">← Back to resources</a><div class="page-heading"><p class="eyebrow">ADMIN WORKSPACE</p><h1>{{ heading }}</h1><p>Resource links are stored without being fetched or checked by the application.</p></div><form class="edit-form" method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Workshop session<select id="session-choice" name="session_id" required><option value="">Choose a session</option>{% for item in sessions %}<option value="{{ item.id }}" data-title="{{ item.title }}" data-day="{{ item.day }}" {% if resource.get('session_title') == item.title and resource.get('day') == item.day and resource.get('time_slot') == item.time_slot %}selected{% endif %}>{{ item.day }} · {{ item.time_slot }} · {{ item.title }}</option>{% endfor %}</select>{% if errors.get('session_title') %}<small class="field-error">{{ errors.session_title }}</small>{% endif %}</label><input id="session-title" type="hidden" name="session_title" value="{{ resource.get('session_title','') }}"><input id="session-day" type="hidden" name="day" value="{{ resource.get('day','') }}"><label>Resource type<select name="resource_type" required><option value="">Choose type</option>{% for kind in ('PDF','Documentation','Article','Video','Website','Other') %}<option value="{{ kind }}" {% if resource.get('resource_type') == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select>{% if errors.get('resource_type') %}<small class="field-error">{{ errors.resource_type }}</small>{% endif %}</label><label>Description<textarea name="description" maxlength="1000" required>{{ resource.get('description','') }}</textarea>{% if errors.get('description') %}<small class="field-error">{{ errors.description }}</small>{% endif %}</label><label>URL<input name="url" maxlength="500" value="{{ resource.get('url','') }}" placeholder="https://example.org/resource" required>{% if errors.get('url') %}<small class="field-error">{{ errors.url }}</small>{% endif %}</label><label>Prerequisite<input name="prerequisite" maxlength="500" value="{{ resource.get('prerequisite','') }}" required>{% if errors.get('prerequisite') %}<small class="field-error">{{ errors.prerequisite }}</small>{% endif %}</label><label>Manual review status<select name="resource_review_status">{% for status in statuses %}<option value="{{ status }}" {% if resource.get('resource_review_status', 'Not Reviewed') == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><div class="filter-actions"><button class="button" type="submit">Save resource</button><a class="button secondary" href="{{ url_for('admin.resource_list') }}">Cancel</a></div></form><script src="{{ url_for('static', filename='js/resource-form.js') }}" defer></script>{% endblock %}
